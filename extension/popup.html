<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DailyPS Hub</title><link rel="stylesheet" href="ui.css"></head>
<body class="popup"><main>
<header class="brand"><div class="wordmark">DailyPS<span>Hub</span></div><p>오늘 푼 코드, GitHub에 차곡차곡</p></header>
<div class="platforms"><span>LeetCode</span><span>프로그래머스</span></div>
<section class="connection"><span class="eyebrow">저장할 곳</span><a id="repo" target="_blank" rel="noreferrer">저장소를 연결하세요</a><small id="branch"></small></section>
<div class="toggle-row"><div><strong>자동 저장</strong><small id="toggleHint">먼저 GitHub를 연결하세요</small></div><label class="switch"><input type="checkbox" id="enabled" aria-label="자동 저장"><span></span></label></div>
<div id="status" class="status" role="status" aria-live="polite">연결 상태 확인 중…</div>
<div class="queue-row"><span id="pending">대기 0개</span><button id="retry" class="text-button">다시 저장</button></div>
<section class="recent"><h2>최근 기록</h2><ul id="recent"><li class="empty">아직 저장한 풀이가 없습니다.</li></ul></section>
<footer><button id="settings" class="primary">⚙ 설정 / 연결</button><a id="github" class="secondary" target="_blank" rel="noreferrer">GitHub 열기 ↗</a></footer>
<p class="footnote">통과한 제출만 저장합니다.</p>
</main><script type="module" src="popup.js"></script></body></html>
